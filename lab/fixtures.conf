events { worker_connections 64; }
http {
  # A normal login page behind a known WAF is still skipped.
  server {
    listen 8081;
    location / {
      add_header CF-RAY "local-fixture" always;
      return 200 '<form id="loginform"><input name="log"><input name="pwd" type="password"></form>';
    }
  }
  server {
    listen 8082;
    location / {
      return 200 '<html><body>Wordfence wfwaf-block: access denied.</body></html>';
    }
  }
  server {
    listen 8083;
    location / { return 429 'Too many requests'; }
  }
  # Deliberately throttle an otherwise valid WordPress login response.
  server {
    listen 8084;
    location / {
      proxy_pass http://wordpress:80;
      proxy_set_header Host $http_host;
      proxy_buffering on;
      limit_rate 64;
    }
  }
}
