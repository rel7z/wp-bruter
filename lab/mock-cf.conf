events { worker_connections 64; }
http {
  server {
    listen 80;
    location /wp-login.php {
      add_header CF-RAY "abc123";
      return 200 '<html><head><title>Just a moment...</title></head><body><div class="challenge-platform">Checking your browser. Ray ID: abc123. Cloudflare</div></body></html>';
    }
    location / { return 200 'ok'; }
  }
}
