events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Simulate Cloudflare WAF challenge
        location /wp-login.php {
            add_header CF-RAY "abc123-SJC";
            return 200 '<!DOCTYPE html>
<html>
<head><title>Attention Required! | Cloudflare</title></head>
<body>
<div class="challenge-platform">
<h1>Please verify you are human</h1>
<p>Ray ID: abc123-SJC</p>
<p>Checking your browser before accessing the website.</p>
<noscript>Please enable JavaScript and cookies to continue.</noscript>
</div>
</body>
</html>';
        }

        location / {
            return 200 'OK';
        }
    }
}
